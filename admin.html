<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MILKLOVE · 投稿管理</title>
<style>
:root{--ink:#352b32;--muted:#786d75;--line:#eadfe5;--pink:#f8e8ef;--green:#e7f2e6;--accent:#b04d77}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#f8e9ef,#e8f3e8);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:26px 16px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{letter-spacing:.14em;font-size:25px;margin:0}h2{font-size:18px;margin:0 0 12px}.sub{color:var(--muted);font-size:13px}.panel{background:#ffffffed;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:18px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--ink);font:inherit}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:#a42e4d;border-color:#edc7d1}.btn:disabled{opacity:.55;cursor:wait}input{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;min-width:0;flex:1}.message{margin-top:10px;color:var(--muted);white-space:pre-wrap}.message.error{color:#b42345}.message.ok{color:#247a56}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab.active{background:var(--green);border-color:#b6d3b4}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;min-width:0}.card img{display:block;width:100%;height:230px;object-fit:contain;background:#f7f4f6;cursor:zoom-in}.body{padding:13px}.caption{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.badge{display:inline-block;border-radius:99px;padding:3px 9px;background:#f7e6ed;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{padding:25px;text-align:center;color:var(--muted)}.hidden{display:none!important}@media(max-width:480px){.wrap{padding:18px 12px 40px}.panel{padding:15px}.card img{height:190px}}
</style></head><body><main class="wrap"><header><div><h1>MILKLOVE</h1><div class="sub">FAN COLLECTION · 投稿审核管理</div></div><div class="row"><span class="sub" id="who">未登录</span><button class="btn" id="logout" hidden>退出登录</button></div></header>
<section class="panel" id="loginPanel"><h2>管理员登录</h2><p class="sub">使用指定管理员邮箱接收登录链接。只有后台权限配置中的邮箱可以审核内容。</p><div class="row"><input id="email" type="email" autocomplete="email" value="1318536137@qq.com" aria-label="管理员邮箱"><button class="btn primary" id="send">发送登录链接</button></div><div class="message" id="loginMsg" aria-live="polite"></div></section>
<section class="panel hidden" id="adminPanel"><div class="row" style="justify-content:space-between"><div><h2>投稿管理</h2><div class="sub">删除操作会同时尝试删除存储中的图片和数据库记录。</div></div><button class="btn" id="refresh">刷新列表</button></div><div class="tabs"><button class="btn tab active" data-status="pending">待审核</button><button class="btn tab" data-status="approved">已通过</button><button class="btn tab" data-status="rejected">已驳回</button><button class="btn tab" data-status="all">全部</button></div><div id="stats" class="sub"></div><div id="cards" class="cards"></div><div id="adminMsg" class="message" aria-live="polite"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// 仅使用网站现有的 Supabase URL 和 publishable key；绝不在网页中放 service_role key。
const SUPABASE_URL='https://evutabepsvsnwvjifbci.supabase.co';
const SUPABASE_KEY='sb_publishable_dfzkvb01C0Phk2HZl8YCog_kqLkP-7z';
const ADMIN_EMAIL='1318536137@qq.com';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,filter='pending',busy=false;
const $=id=>document.getElementById(id);const msg=(id,text,type='')=>{$(id).textContent=text;$(id).className='message '+type};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(){const admin=!!user&&String(user.email||'').toLowerCase()===ADMIN_EMAIL; $('who').textContent=user?user.email:'未登录';$('logout').hidden=!user;$('loginPanel').classList.toggle('hidden',admin);$('adminPanel').classList.toggle('hidden',!admin);if(user&&!admin)msg('loginMsg','当前登录邮箱不是指定管理员邮箱，无法进入管理后台。请退出后使用 '+ADMIN_EMAIL+' 登录。','error');if(admin)load();}
$('send').addEventListener('click',async()=>{const email=$('email').value.trim().toLowerCase();if(email!==ADMIN_EMAIL){msg('loginMsg','请使用指定的管理员邮箱：'+ADMIN_EMAIL,'error');return}const b=$('send');b.disabled=true;try{const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});if(error)throw error;msg('loginMsg','登录链接已发送。请打开邮箱，点击链接后返回此管理页面。若提示邮件发送限制，需要先解决 Supabase 邮件发送配置。','ok')}catch(e){msg('loginMsg','发送失败：'+e.message,'error')}finally{b.disabled=false}});
$('logout').addEventListener('click',async()=>{await client.auth.signOut();user=null;show()});$('refresh').addEventListener('click',load);
document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.status;document.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('active',x===b));load()}));
async function load(){if(!user||String(user.email||'').toLowerCase()!==ADMIN_EMAIL)return;const root=$('cards');root.innerHTML='<div class="empty">正在读取投稿…</div>';msg('adminMsg','');let q=client.from('product_reviews').select('id,product_id,caption,created_at,user_id,image_path,status').order('created_at',{ascending:false}).limit(200);if(filter!=='all')q=q.eq('status',filter);const {data,error}=await q;if(error){root.innerHTML='';msg('adminMsg','读取失败：'+error.message+'。请确认已经运行管理员权限 SQL。','error');return}$('stats').textContent='当前显示 '+data.length+' 条'+(data.length===200?'（最多显示最新 200 条）':'');if(!data.length){root.innerHTML='<div class="empty">这个分类暂时没有投稿。</div>';return}root.innerHTML=data.map(r=>{const {data:u}=client.storage.from('community-photos').getPublicUrl(r.image_path);const st={pending:'待审核',approved:'已通过',rejected:'已驳回'}[r.status]||r.status;return `<article class="card" data-id="${esc(r.id)}"><img src="${esc(u.publicUrl)}" alt="投稿照片" loading="lazy"><div class="body"><span class="badge">${esc(st)}</span><div class="caption">${esc(r.caption)}</div><div class="meta">商品 ID：${esc(r.product_id)}<br>投稿时间：${esc(new Date(r.created_at).toLocaleString())}<br>投稿用户：${esc(r.user_id)}</div><div class="actions">${r.status!=='approved'?'<button class="btn primary" data-action="approved">通过</button>':''}${r.status!=='rejected'?'<button class="btn" data-action="rejected">驳回</button>':''}<button class="btn danger" data-action="delete">删除照片</button></div></div></article>`}).join('');root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.closest('.card').dataset.id,b.dataset.action,b)));}
async function act(id,action,btn){if(busy)return;const card=btn.closest('.card');const record=(await client.from('product_reviews').select('id,image_path,status').eq('id',id).maybeSingle());if(record.error||!record.data){msg('adminMsg','无法读取这条投稿：'+(record.error?.message||'记录不存在'),'error');return}if(action==='delete'&&!confirm('确定永久删除这张照片及其分享记录吗？此操作无法撤销。'))return;busy=true;btn.disabled=true;try{if(action==='approved'||action==='rejected'){const {error}=await client.from('product_reviews').update({status:action}).eq('id',id);if(error)throw error;msg('adminMsg',action==='approved'?'已审核通过。':'已驳回投稿。','ok')}else{const path=record.data.image_path;const {error:storageError}=await client.storage.from('community-photos').remove([path]);if(storageError)throw new Error('删除图片失败，数据库记录未删除：'+storageError.message);const {error:deleteError}=await client.from('product_reviews').delete().eq('id',id);if(deleteError)throw new Error('图片已删除，但删除数据库记录失败：'+deleteError.message);msg('adminMsg','照片和分享记录已删除。','ok')}await load()}catch(e){msg('adminMsg','操作失败：'+e.message+'。请检查 SQL 权限配置及登录邮箱。','error')}finally{busy=false;btn.disabled=false}}
client.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;show()});client.auth.getSession().then(({data})=>{user=data.session?.user||null;show()});
</script></body></html>
